<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" style="background:#050505; border:1px solid #333333; display:block;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
